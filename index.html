<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Башня 3D</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,-apple-system,Segoe UI,sans-serif;touch-action:none;user-select:none;background:linear-gradient(#ff9a9e,#fad0c4 55%,#fbc2eb)}
canvas#c{position:fixed;inset:0;width:100%;height:100%}
.t{position:fixed;color:#fff;font-weight:800;pointer-events:none;text-shadow:0 3px 0 rgba(0,0,0,.15)}
#sc{top:calc(env(safe-area-inset-top,0px) + 10px);left:0;right:0;text-align:center;font-size:72px}
#bs{top:calc(env(safe-area-inset-top,0px) + 92px);left:0;right:0;text-align:center;font-size:17px}
#cn{top:calc(env(safe-area-inset-top,0px) + 14px);left:14px;font-size:20px}
#eff{top:calc(env(safe-area-inset-top,0px) + 14px);right:14px;font-size:16px;text-align:right}
#fx{top:40%;left:0;right:0;text-align:center;font-size:32px;opacity:0}
#dark{position:fixed;inset:0;pointer-events:none;display:none;background:radial-gradient(circle at 50% 55%,rgba(0,0,0,0) 50px,rgba(0,0,0,.97) 160px)}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;background:rgba(80,30,90,.55);padding:20px;box-sizing:border-box}
#wheel,#shop,#casino{display:none;background:rgba(40,10,60,.88)}#casino{justify-content:flex-start;overflow-y:auto;padding-top:calc(env(safe-area-inset-top,0px) + 20px)}#reels{font-size:52px;margin:6px 0}
h1{margin:0 0 8px;font-size:38px}h2{margin:0 0 10px}p{margin:4px 0}
button{margin-top:14px;font-size:19px;font-weight:800;padding:13px 34px;border:0;border-radius:30px;background:#fff;color:#c2185b}
button.s{background:#ffd23f;color:#5a3a00}
.it{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;max-width:380px;background:rgba(255,255,255,.15);border-radius:16px;padding:10px 14px;margin:6px 0;text-align:left}
.it small{opacity:.8;display:block}
.it button{margin:0;padding:8px 16px;font-size:16px;white-space:nowrap}
.it button[disabled]{opacity:.5}
</style></head><body>
<canvas id="c"></canvas>
<div id="sc" class="t">0</div><div id="bs" class="t">Рекорд: 0</div><div id="cn" class="t"></div><div id="eff" class="t"></div><div id="fx" class="t"></div>
<div id="dark"></div>
<div id="msg" class="ov"></div><div id="wheel" class="ov"></div><div id="shop" class="ov"></div><div id="casino" class="ov"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const R=new THREE.WebGLRenderer({canvas:$('c'),antialias:true,alpha:true});
const S=new THREE.Scene(),C=new THREE.OrthographicCamera(-3,3,3,-3,-50,100);
S.add(new THREE.HemisphereLight(0xffffff,0xff9acb,.9));
const dl=new THREE.DirectionalLight(0xffffff,.7);dl.position.set(5,10,3);S.add(dl);
function rs(){R.setPixelRatio(Math.min(2,devicePixelRatio));R.setSize(innerWidth,innerHeight,false);const a=innerWidth/innerHeight;
if(a<1){C.left=-3;C.right=3;C.top=3/a;C.bottom=-3/a}else{C.top=3;C.bottom=-3;C.left=-3*a;C.right=3*a}C.updateProjectionMatrix()}
addEventListener('resize',rs);rs();
const H=.5,G=new THREE.BoxGeometry(1,H,1);
let st=[],cur=null,ax,dir,pos,spd,lvl=0,run=false,wo=false,best=0,pieces=[],camY=0,combo=0,item=null,shield=false,eff='',effL=0,coins=0,owned={},chips=0,bgi=0,busy=false,cr='',cmsg='';
try{best=+localStorage.getItem('tw_best')||0;coins=+localStorage.getItem('tw_coins')||0;owned=JSON.parse(localStorage.getItem('tw_own')||'{}');chips=+localStorage.getItem('tw_chips')||0;bgi=+localStorage.getItem('tw_bg')||0}catch(e){}
function save(){try{localStorage.setItem('tw_best',best);localStorage.setItem('tw_coins',coins);localStorage.setItem('tw_own',JSON.stringify(owned));localStorage.setItem('tw_chips',chips);localStorage.setItem('tw_bg',bgi)}catch(e){}}
function hud(){$('cn').textContent='🪙 '+coins+'  🎟 '+chips;$('bs').textContent='Рекорд: '+best;
const N={tor:'🌪 Торнадо',dark:'🌑 Тьма',slow:'🐢 Замедление',fast:'⚡ Ускорение'};
$('eff').innerHTML=(shield?'🛡 Щит<br>':'')+(eff?N[eff]+' · '+effL:'');$('dark').style.display=eff=='dark'?'block':'none'}
const base=()=>owned.wd?3.6:3;
function blk(w,d,x,z,y,l){const col=owned.gd?new THREE.Color().setHSL(.11+(l%6)*.01,.85,.5+(l%4)*.04):new THREE.Color().setHSL((l*.035)%1,.65,.62);
const m=new THREE.Mesh(G,new THREE.MeshLambertMaterial({color:col}));m.scale.set(w,1,d);m.position.set(x,y,z);S.add(m);return{m,w,d,x,z}}
function clr(){st.forEach(b=>S.remove(b.m));pieces.forEach(b=>S.remove(b.m));if(cur)S.remove(cur.m);if(item)S.remove(item.m);st=[];pieces=[];cur=null;item=null}
function start(){$('msg').style.display='none';$('shop').style.display='none';clr();const b=base();st=[blk(b,b,0,0,0,0)];lvl=0;combo=0;run=true;camY=0;shield=!!owned.sh;eff='';effL=0;$('sc').textContent=0;nxt();hud()}
function nxt(){lvl++;const t=st[st.length-1];ax=lvl%2?'x':'z';dir=1;pos=-4.5;cur=blk(t.w,t.d,ax=='x'?pos:t.x,ax=='z'?pos:t.z,lvl*H,lvl);spd=Math.min(7,3+lvl*.07)}
function fx(t){const e=$('fx');e.textContent=t;e.style.transition='none';e.style.opacity=1;requestAnimationFrame(()=>{e.style.transition='opacity .7s';e.style.opacity=0})}
function resize(f){const mx=3.8,mn=.8;[st[st.length-1],cur].forEach(b=>{b.w=Math.max(mn,Math.min(mx,b.w*f));b.d=Math.max(mn,Math.min(mx,b.d*f));b.m.scale.set(b.w,1,b.d)})}
function mkItem(b,g){const m=new THREE.Mesh(g?new THREE.OctahedronGeometry(.34):new THREE.CylinderGeometry(.28,.28,.08,20).rotateX(Math.PI/2),
new THREE.MeshLambertMaterial(g?{color:0xb061ff,emissive:0x5a1aa0}:{color:0xffd23f,emissive:0x665500}));
const x=b.x+(Math.random()-.5)*b.w*.8,z=b.z+(Math.random()-.5)*b.d*.8,y=b.m.position.y+H/2+.45;m.position.set(x,y,z);S.add(m);item={m,x,z,y,g}}
function drop(){if(!run||wo)return;const t=st[st.length-1],dm=ax=='x'?'w':'d',c=ax=='x'?cur.x:cur.z,tc=ax=='x'?t.x:t.z,s=t[dm];
let dl=c-tc,ov=s-Math.abs(dl),saved=false;
if(ov<=0){if(!shield){pieces.push(cur);cur.vy=0;end();return}shield=false;saved=true;dl=0;ov=s}
let nc=c,ns=s;
if(Math.abs(dl)<.12){nc=tc;combo++;coins+=2;fx(saved?'🛡 ЩИТ СПАС!':combo>1?'ИДЕАЛЬНО x'+combo+' +2🪙':'ИДЕАЛЬНО! +2🪙');if(combo>=3)ns=Math.min(base(),s+.15)}
else{combo=0;ns=ov;nc=tc+dl/2;const oc=dl>0?(tc+s/2+c+s/2)/2:(c-s/2+tc-s/2)/2,
p=blk(ax=='x'?Math.abs(dl):cur.w,ax=='z'?Math.abs(dl):cur.d,ax=='x'?oc:cur.x,ax=='z'?oc:cur.z,cur.m.position.y,lvl);p.vy=0;pieces.push(p)}
const b={m:cur.m,w:ax=='x'?ns:cur.w,d:ax=='z'?ns:cur.d,x:ax=='x'?nc:t.x,z:ax=='z'?nc:t.z};
b.m.scale.set(b.w,1,b.d);b.m.position.x=b.x;b.m.position.z=b.z;st.push(b);
let gem=false;
if(item){if(Math.abs(item.x-b.x)<=b.w/2&&Math.abs(item.z-b.z)<=b.d/2){if(item.g)gem=true;else{coins+=5;fx('+5 🪙')}}S.remove(item.m);item=null}
const lk=owned.lk?.22:.1,r=Math.random();if(r<lk)mkItem(b,true);else if(r<lk+.35)mkItem(b,false);
if(effL>0&&--effL==0)eff='';
$('sc').textContent=lvl;nxt();hud();save();
if(gem)wheel()}
function end(){run=false;cur=null;if(item){S.remove(item.m);item=null}eff='';effL=0;shield=false;const nb=lvl-1>best;if(nb)best=lvl-1;coins+=lvl-1;save();hud();
setTimeout(()=>menu(nb?'НОВЫЙ РЕКОРД!':'Башня упала','<p>Этажей: '+(lvl-1)+' (+'+(lvl-1)+' 🪙)</p><p>Рекорд: '+best+'</p>'),700)}
function menu(h,l){const m=$('msg');m.style.display='flex';m.innerHTML='<h1>'+h+'</h1>'+l+'<button onclick="start()">'+(run||lvl?'Ещё раз':'Старт')+'</button><button class="s" onclick="openShop()">🛒 Магазин</button><button class="s" onclick="openCasino()">🎰 Казино</button>'}
const SH=[{id:'sh',n:'🛡 Стартовый щит',d:'Щит в начале каждой игры',p:120},{id:'wd',n:'📐 Широкая база',d:'Башня стартует шире',p:100},{id:'lk',n:'💎 Удача',d:'Фиолетовый камень чаще',p:150},{id:'gd',n:'✨ Золотые блоки',d:'Золотой стиль',p:80}];
function openShop(){const s=$('shop');s.style.display='flex';s.innerHTML='<h2>МАГАЗИН · 🪙 '+coins+'</h2>'+SH.map(i=>'<div class="it"><div><b>'+i.n+'</b><small>'+i.d+'</small></div><button '+(owned[i.id]||coins<i.p?'disabled':'')+' onclick="buy(\''+i.id+'\')">'+(owned[i.id]?'Куплено':i.p+' 🪙')+'</button></div>').join('')+'<button onclick="$(\'shop\').style.display=\'none\'">Назад</button>'}
function buy(id){const i=SH.find(x=>x.id==id);if(owned[id]||coins<i.p)return;coins-=i.p;owned[id]=1;save();hud();openShop()}
const BG=[{n:'Закат',p:0,c:'linear-gradient(#ff9a9e,#fad0c4 55%,#fbc2eb)'},{n:'Море',p:30,c:'linear-gradient(#4facfe,#00f2fe)'},{n:'Ночь',p:60,c:'linear-gradient(#0f2027,#203a43 55%,#2c5364)'},{n:'Космос',p:100,c:'radial-gradient(circle at 30% 20%,#4b2a8a,#0b0620 70%)'},{n:'Неон',p:150,c:'linear-gradient(#ff00cc,#3333ff)'}];
const ob=i=>BG[i].p==0||owned['bg'+i];
function setBg(){document.body.style.background=BG[bgi].c}
const SY=['🍒','🍋','🔔','💎','7️⃣'];
function openCasino(){const s=$('casino');s.style.display='flex';
s.innerHTML='<h2>🎰 КАЗИНО · 🎟 '+chips+'</h2><div id="reels">'+(cr||'🎰🎰🎰')+'</div><p>'+cmsg+'</p>'+
'<button onclick="spin()">Слоты · ставка 5 🎟</button><button class="s" onclick="flip(0)">🦅 Орёл · 10 🎟</button><button class="s" onclick="flip(1)">🪙 Решка · 10 🎟</button><button onclick="swap()">Обмен: 50 🪙 → 5 🎟</button>'+
'<h2 style="margin-top:18px">🖼 ФОНЫ (за 🎟)</h2>'+BG.map((b,i)=>'<div class="it"><div><b>'+b.n+'</b></div><button '+(bgi==i||(!ob(i)&&chips<b.p)?'disabled':'')+' onclick="bgBtn('+i+')">'+(bgi==i?'Выбрано':ob(i)?'Выбрать':b.p+' 🎟')+'</button></div>').join('')+
'<button onclick="$(\'casino\').style.display=\'none\'">Назад</button>'}
function spin(){if(busy||chips<5)return;chips-=5;busy=true;save();hud();
const f=()=>SY[Math.floor(Math.random()*5)],iv=setInterval(()=>{const e=$('reels');if(e)e.textContent=f()+f()+f()},80);
setTimeout(()=>{clearInterval(iv);const a=[f(),f(),f()];let w=0;
if(a[0]==a[1]&&a[1]==a[2])w=5*[4,4,6,10,20][SY.indexOf(a[0])];else if(a[0]==a[1]||a[1]==a[2]||a[0]==a[2])w=5;
chips+=w;cr=a.join('');cmsg=w>5?'🎉 Выигрыш +'+(w-5)+' 🎟':w==5?'Ставка возвращена':'Мимо −5 🎟';busy=false;save();hud();openCasino()},1100)}
function flip(s){if(busy||chips<10)return;chips-=10;const x=Math.random()<.47?s:1-s,win=x==s;if(win)chips+=20;
cr=x?'🪙 Решка':'🦅 Орёл';cmsg=win?'Угадал! +10 🎟':'Не угадал −10 🎟';save();hud();openCasino()}
function swap(){if(coins<50)return;coins-=50;chips+=5;save();hud();openCasino()}
function bgBtn(i){if(!ob(i)){if(chips<BG[i].p)return;chips-=BG[i].p;owned['bg'+i]=1}bgi=i;setBg();save();hud();openCasino()}
const WS=[{n:'🛡 Щит',g:1},{n:'🌪 Торнадо',g:0},{n:'🐢 Замедление',g:1},{n:'🌑 Тьма',g:0},{n:'📐 Широкий',g:1},{n:'⚡ Ускорение',g:0},{n:'🪙 +30',g:1},{n:'✂ Узкий',g:0}];
function wheel(){wo=true;const w=$('wheel');w.style.display='flex';w.innerHTML='<h2>🎡 КОЛЕСО ФОРТУНЫ</h2><canvas id="wc" width="300" height="300"></canvas><h2 id="wr">&nbsp;</h2>';
const c=$('wc').getContext('2d'),sg=Math.PI*2/8,idx=Math.floor(Math.random()*8),fin=Math.PI*12-(idx+.5)*sg+(Math.random()-.5)*sg*.5,t0=performance.now();
function dr(r){c.clearRect(0,0,300,300);c.save();c.translate(150,160);c.rotate(r);
for(let i=0;i<8;i++){c.beginPath();c.moveTo(0,0);c.arc(0,0,130,i*sg-Math.PI/2,(i+1)*sg-Math.PI/2);c.fillStyle=WS[i].g?(i%4<2?'#2ecc71':'#27ae60'):(i%4<2?'#e74c3c':'#c0392b');c.fill();
c.save();c.rotate((i+.5)*sg);c.fillStyle='#fff';c.font='bold 14px sans-serif';c.textAlign='center';c.fillText(WS[i].n,0,-70);c.restore()}
c.restore();c.fillStyle='#fff';c.beginPath();c.moveTo(150,42);c.lineTo(137,10);c.lineTo(163,10);c.fill()}
function an(n){const p=Math.min(1,(n-t0)/3200);dr(fin*(1-Math.pow(1-p,3)));if(p<1){requestAnimationFrame(an);return}
const r=WS[idx];$('wr').textContent=(r.g?'👍 ':'💀 ')+r.n;$('wr').style.color=r.g?'#7dffa8':'#ff8a8a';
setTimeout(()=>{w.style.display='none';wo=false;apply(idx)},1400)}
requestAnimationFrame(an)}
function apply(i){const E=['','tor','slow','dark','','fast','',''];
if(i==0)shield=true;else if(i==4)resize(1.35);else if(i==7)resize(.7);else if(i==6)coins+=30;else{eff=E[i];effL=8}
hud();save()}
addEventListener('pointerdown',e=>{if(!e.target.closest('button,.ov'))drop()});
addEventListener('keydown',e=>{if(e.key==' '||e.key=='Enter'){if(run)drop();else if($('msg').style.display!='none'&&$('shop').style.display!='flex')start()}});
let last=performance.now();
function loop(n){requestAnimationFrame(loop);const dt=Math.min(.05,(n-last)/1000);last=n;
if(run&&cur&&!wo){const m=eff=='slow'?.6:eff=='fast'?1.8:eff=='tor'?1.4:1;pos+=dir*spd*m*dt;if(pos>4.5)dir=-1;if(pos<-4.5)dir=1;
if(ax=='x')cur.m.position.x=cur.x=pos;else cur.m.position.z=cur.z=pos}
if(item){item.m.rotation.y+=dt*3;item.m.position.y=item.y+Math.sin(n/250)*.08}
pieces.forEach(p=>{p.vy-=18*dt;p.m.position.y+=p.vy*dt;p.m.rotation.z+=dt});
pieces=pieces.filter(p=>{if(p.m.position.y<camY-12){S.remove(p.m);return false}return true});
const ty=(run?lvl:lvl-1)*H;camY+=(ty-camY)*Math.min(1,dt*3);
const a=Math.PI/4+(run&&eff=='tor'?Math.sin(n/350)*.8:0);
C.position.set(Math.cos(a)*8.5,camY+6,Math.sin(a)*8.5);C.lookAt(0,camY+1.5,0);R.render(S,C)}
setBg();hud();menu('БАШНЯ','<p>Тапни, чтобы уронить блок</p><p>Лови 🪙 и фиолетовый камень 💎</p>');
requestAnimationFrame(loop);
</script></body></html>
